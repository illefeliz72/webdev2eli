# Dedicated disposable test database — never points to live/dev schema
spring.datasource.url=jdbc:mysql://localhost:3306/pet_adoption_test_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# Safe logging — never log passwords, Authorization headers, cookies, or CSRF tokens
logging.level.root=WARN
logging.level.org.springframework.security=INFO
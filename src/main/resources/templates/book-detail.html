<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Book Details</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="container mt-4">
    <h1>Book Details</h1>

    <div th:if="${book != null}" class="card style='width: 18rem;'">
        <div class="card-body">
            <h5 class="card-title" th:text="${book.title}">Book Title</h5>
            <h6 class="card-subtitle mb-2 text-muted" th:text="'Author: ' + ${book.author}">Author</h6>
            <p class="card-text" th:text="'Price: $' + ${book.price}">$0.00</p>
            <p class="card-text" th:text="'ID: ' + ${book.id}">1</p>
        </div>
    </div>

    <div th:if="${book == null}" class="alert alert-danger">
        Book not found!
    </div>

    <a href="/books" class="btn btn-secondary mt-3">Back to List</a>
</body>
</html>
